<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>マイサイト</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      font-family: "Noto Sans JP", sans-serif;
      color: #253041;
      background: #f6f8fb;
      line-height: 1.8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5eaf0;
    }

    .wrap {
      width: min(960px, calc(100% - 32px));
      margin: auto;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0;
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: 1.3rem;
    }

    h2 {
      margin-bottom: 16px;
      font-size: 1.35rem;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    main {
      padding: 32px 0 64px;
    }

    section {
      margin-bottom: 32px;
    }

    .card {
      padding: 24px;
      margin-bottom: 16px;
      background: #fff;
      border: 1px solid #e5eaf0;
      border-radius: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .grid .card {
      margin-bottom: 0;
    }

    .multiline {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    a {
      color: #315ed2;
      overflow-wrap: anywhere;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      padding: 8px 14px;
      color: #fff;
      background: #315ed2;
      border: 0;
      border-radius: 8px;
    }

    button.secondary {
      color: #253041;
      background: #e9edf3;
    }

    button.danger {
      color: #a32f3b;
      background: #fcebed;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    label {
      display: block;
      margin-bottom: 14px;
      font-weight: 500;
    }

    input,
    textarea {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 9px 11px;
      color: #253041;
      background: #fff;
      border: 1px solid #cdd6e1;
      border-radius: 8px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .hint {
      color: #627086;
      font-size: 0.9rem;
    }

    .status {
      min-height: 1.8em;
      color: #315ed2;
    }

    .editor-item {
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid #dce3ec;
      border-radius: 10px;
    }

    [hidden] {
      display: none !important;
    }

    /* 公開ページの左メニュー */
    #public-view {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 32px;
      align-items: start;
    }

    .site-nav {
      position: sticky;
      top: 24px;
      padding: 16px;
      background: #fff;
      border: 1px solid #e5eaf0;
      border-radius: 14px;
    }

    .site-nav a {
      display: block;
      padding: 10px 12px;
      color: #253041;
      text-decoration: none;
      border-radius: 8px;
    }

    .site-nav a:hover,
    .site-nav a:focus-visible,
    .site-nav a[aria-current="page"] {
      color: #315ed2;
      background: #f0f4ff;
    }

    .public-content section {
      scroll-margin-top: 24px;
    }

    @media (max-width: 640px) {
      #public-view {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .site-nav {
        position: static;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap header-inner">
      <h1 id="site-name">マイサイト</h1>
      <button id="open-admin" class="secondary" type="button">
        管理画面
      </button>
    </div>
  </header>

  <main class="wrap">
    <div id="public-view">
      <nav class="site-nav" aria-label="サイトメニュー">
        <a href="#about" aria-current="page">自己紹介</a>
        <a href="#works-section">作品</a>
        <a href="#blog-section">ブログ</a>
      </nav>

      <div class="public-content">
        <section id="about">
          <h2>自己紹介</h2>
          <div class="card">
            <p id="profile" class="multiline"></p>
          </div>
        </section>

        <section id="works-section" hidden>
          <h2>作品</h2>
          <div id="works" class="grid"></div>
        </section>

        <section id="blog-section" hidden>
          <h2>ブログ</h2>
          <div id="posts"></div>
        </section>
      </div>
    </div>

    <div id="admin-view" hidden>
      <div class="actions">
        <h2>管理画面</h2>
        <button id="close-admin" class="secondary" type="button">
          サイトに戻る
        </button>
      </div>

      <div class="card">
        <h3>GitHubに接続</h3>
        <p class="hint">
          トークンはこの画面を開いている間だけ使用し、サイトのデータには保存しません。
        </p>

        <label>
          ユーザー名
          <input id="owner" autocomplete="off">
        </label>

        <label>
          リポジトリ名
          <input id="repo" autocomplete="off">
        </label>

        <label>
          公開に使うブランチ
          <input id="branch" value="main" autocomplete="off">
        </label>

        <label>
          GitHubのアクセストークン
          <input id="token" type="password" autocomplete="off">
        </label>

        <button id="connect" type="button">接続する</button>
      </div>

      <div id="editor" hidden>
        <div class="card">
          <h3>基本情報</h3>

          <label>
            サイト名
            <input id="edit-name">
          </label>

          <label>
            自己紹介
            <textarea id="edit-profile"></textarea>
          </label>
        </div>

        <div class="card">
          <h3>作品</h3>
          <div id="work-editor"></div>
          <button id="add-work" class="secondary" type="button">
            作品を追加
          </button>
        </div>

        <div class="card">
          <h3>ブログ</h3>
          <div id="post-editor"></div>
          <button id="add-post" class="secondary" type="button">
            記事を追加
          </button>
        </div>

        <div class="card">
          <div class="actions">
            <button id="save" type="button">変更を保存して公開</button>
          </div>
          <p class="hint">
            ファイルのアップロード後も、このボタンで作品情報を保存してください。
            公開サイトへの反映には少し時間がかかる場合があります。
          </p>
        </div>
      </div>

      <p id="status" class="status" role="status"></p>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const initialData = () => ({
      siteName: "マイサイト",
      profile: "ここに自己紹介を書きます。",
      works: [],
      posts: []
    });

    let data = initialData();
    let connection = null;
    let busy = false;

    function normalize(value) {
      return {
        siteName: String(value?.siteName || "マイサイト"),
        profile: String(value?.profile || ""),
        works: Array.isArray(value?.works) ? value.works : [],
        posts: Array.isArray(value?.posts) ? value.posts : []
      };
    }

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function safeLink(value) {
      if (!value) return null;

      try {
        const url = new URL(value, window.location.href);
        if (url.protocol !== "https:" && url.protocol !== "http:") {
          return null;
        }
        return url.href;
      } catch {
        return null;
      }
    }

    /* 左メニューで表示する項目を切り替え */
    function showPublicSection() {
      const sectionIds = ["about", "works-section", "blog-section"];
      const requestedId = window.location.hash.slice(1);
      const selectedId = sectionIds.includes(requestedId)
        ? requestedId
        : "about";

      sectionIds.forEach((id) => {
        $(id).hidden = id !== selectedId;
      });

      document.querySelectorAll(".site-nav a").forEach((link) => {
        if (link.getAttribute("href") === `#${selectedId}`) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });
    }

    window.addEventListener("hashchange", showPublicSection);
    showPublicSection();

    function renderPublic() {
      document.title = data.siteName;
      $("site-name").textContent = data.siteName;
      $("profile").textContent = data.profile;

      const works = $("works");
      works.replaceChildren();

      data.works.forEach((work) => {
        const card = element("article", undefined, "card");
        card.append(element("h3", work.title || "無題"));
        card.append(element("p", work.description || "", "multiline"));

        const url = safeLink(work.file);
        if (url) {
          const link = element("a", "ファイルを開く・ダウンロード");
          link.href = url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          card.append(link);
        }

        works.append(card);
      });

      const posts = $("posts");
      posts.replaceChildren();

      data.posts.forEach((post) => {
        const card = element("article", undefined, "card");
        card.append(element("h3", post.title || "無題"));

        if (post.date) {
          card.append(element("p", post.date, "hint"));
        }

        card.append(element("p", post.body || "", "multiline"));
        posts.append(card);
      });
    }

    function field(parent, labelText, value, onInput, multiline = false) {
      const label = element("label", labelText);
      const input = document.createElement(multiline ? "textarea" : "input");
      input.value = value || "";
      input.addEventListener("input", () => onInput(input.value));
      label.append(input);
      parent.append(label);
      return input;
    }

    function setStatus(message) {
      $("status").textContent = message;
    }

    function setBusy(value) {
      busy = value;
      $("connect").disabled = value;
      $("save").disabled = value;
      document.querySelectorAll(".upload-button").forEach((button) => {
        button.disabled = value;
      });
    }

    function renderEditors() {
      $("edit-name").value = data.siteName;
      $("edit-profile").value = data.profile;

      const workEditor = $("work-editor");
      workEditor.replaceChildren();

      data.works.forEach((work, index) => {
        const box = element("div", undefined, "editor-item");
        box.append(element("h3", `作品 ${index + 1}`));

        field(box, "タイトル", work.title, (value) => {
          work.title = value;
        });

        field(box, "説明", work.description, (value) => {
          work.description = value;
        }, true);

        const filePath = field(
          box,
          "ファイルのURLまたはパス",
          work.file,
          (value) => {
            work.file = value;
          }
        );

        const fileLabel = element("label", "ファイルを選択");
        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileLabel.append(fileInput);
        box.append(fileLabel);

        const actions = element("div", undefined, "actions");

        const uploadButton = element("button", "ファイルをアップロード");
        uploadButton.type = "button";
        uploadButton.className = "upload-button";
        uploadButton.disabled = busy;

        uploadButton.addEventListener("click", async () => {
          const file = fileInput.files[0];

          if (!file) {
            setStatus("アップロードするファイルを選択してください。");
            return;
          }

          if (file.size > 5 * 1024 * 1024) {
            setStatus("この画面からアップロードできるのは5MBまでです。");
            return;
          }

          setBusy(true);
          setStatus("ファイルをアップロードしています…");

          try {
            const extension = file.name.match(/\.[a-zA-Z0-9]{1,10}$/)?.[0] || "";
            const id = crypto.randomUUID();
            const path = `uploads/${id}${extension.toLowerCase()}`;
            const bytes = new Uint8Array(await file.arrayBuffer());

            await putFile(path, bytesToBase64(bytes), "作品ファイルを追加");

            work.file = path;
            filePath.value = path;
            setStatus("ファイルをアップロードしました。変更を保存して公開してください。");
          } catch (error) {
            setStatus(`アップロードできませんでした: ${error.message}`);
          } finally {
            setBusy(false);
          }
        });

        const remove = element("button", "この作品を削除");
        remove.type = "button";
        remove.className = "danger";
        remove.addEventListener("click", () => {
          data.works.splice(index, 1);
          renderEditors();
        });

        actions.append(uploadButton, remove);
        box.append(actions);
        workEditor.append(box);
      });

      const postEditor = $("post-editor");
      postEditor.replaceChildren();

      data.posts.forEach((post, index) => {
        const box = element("div", undefined, "editor-item");
        box.append(element("h3", `記事 ${index + 1}`));

        field(box, "タイトル", post.title, (value) => {
          post.title = value;
        });

        field(box, "日付", post.date, (value) => {
          post.date = value;
        });

        field(box, "本文", post.body, (value) => {
          post.body = value;
        }, true);

        const remove = element("button", "この記事を削除");
        remove.type = "button";
        remove.className = "danger";
        remove.addEventListener("click", () => {
          data.posts.splice(index, 1);
          renderEditors();
        });

        box.append(remove);
        postEditor.append(box);
      });
    }

    function bytesToBase64(bytes) {
      let binary = "";
      const chunkSize = 8192;

      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
      }

      return btoa(binary);
    }

    function base64ToText(base64) {
      const binary = atob(base64.replace(/\s/g, ""));
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function apiPath(path) {
      const encodedPath = path.split("/").map(encodeURIComponent).join("/");
      return `https://api.github.com/repos/${encodeURIComponent(connection.owner)}/${encodeURIComponent(connection.repo)}/contents/${encodedPath}`;
    }

    async function githubRequest(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${connection.token}`,
          "Content-Type": "application/json",
          ...options.headers
        }
      });

      if (response.status === 404 && options.allow404) return null;

      const result = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(result.message || `GitHubエラー: ${response.status}`);
      }

      return result;
    }

    async function getFile(path) {
      const url = `${apiPath(path)}?ref=${encodeURIComponent(connection.branch)}`;
      return githubRequest(url, { allow404: true });
    }

    async function putFile(path, content, message) {
      const existing = await getFile(path);
      const body = {
        message,
        content,
        branch: connection.branch
      };

      if (existing?.sha) body.sha = existing.sha;

      return githubRequest(apiPath(path), {
        method: "PUT",
        body: JSON.stringify(body)
      });
    }

    $("open-admin").addEventListener("click", () => {
      $("public-view").hidden = true;
      $("admin-view").hidden = false;
    });

    $("close-admin").addEventListener("click", () => {
      renderPublic();
      $("admin-view").hidden = true;
      $("public-view").hidden = false;
    });

    $("edit-name").addEventListener("input", (event) => {
      data.siteName = event.target.value;
    });

    $("edit-profile").addEventListener("input", (event) => {
      data.profile = event.target.value;
    });

    $("add-work").addEventListener("click", () => {
      data.works.push({ title: "", description: "", file: "" });
      renderEditors();
    });

    $("add-post").addEventListener("click", () => {
      data.posts.unshift({ title: "", date: "", body: "" });
      renderEditors();
    });

    $("connect").addEventListener("click", async () => {
      const next = {
        owner: $("owner").value.trim(),
        repo: $("repo").value.trim(),
        branch: $("branch").value.trim(),
        token: $("token").value.trim()
      };

      if (!next.owner || !next.repo || !next.branch || !next.token) {
        setStatus("接続情報をすべて入力してください。");
        return;
      }

      connection = next;
      setBusy(true);
      setStatus("GitHubに接続しています…");

      try {
        const repoUrl = `https://api.github.com/repos/${encodeURIComponent(next.owner)}/${encodeURIComponent(next.repo)}`;
        await githubRequest(repoUrl);

        const saved = await getFile("site-data.json");

        if (saved) {
          data = normalize(JSON.parse(base64ToText(saved.content)));
        } else {
          data = initialData();
        }

        $("token").value = "";
        $("editor").hidden = false;
        renderEditors();
        setStatus("接続しました。編集後に「変更を保存して公開」を押してください。");
      } catch (error) {
        connection = null;
        $("editor").hidden = true;
        setStatus(`接続できませんでした: ${error.message}`);
      } finally {
        setBusy(false);
      }
    });

    $("save").addEventListener("click", async () => {
      if (!connection || busy) return;

      setBusy(true);
      setStatus("変更を保存しています…");

      try {
        const json = JSON.stringify(data, null, 2);
        const content = bytesToBase64(new TextEncoder().encode(json));
        await putFile("site-data.json", content, "サイトの内容を更新");
        renderPublic();
        setStatus("保存しました。GitHub Pagesへの反映をお待ちください。");
      } catch (error) {
        setStatus(`保存できませんでした: ${error.message}`);
      } finally {
        setBusy(false);
      }
    });

    async function loadPublicData() {
      try {
        const response = await fetch("site-data.json", { cache: "no-store" });

        if (response.ok) {
          data = normalize(await response.json());
        }
      } catch {
        // 初回公開時など、データがない場合は初期表示を使います。
      }

      renderPublic();
    }

    const hostParts = window.location.hostname.split(".");
    if (hostParts.length >= 3 && hostParts.slice(-2).join(".") === "github.io") {
      const owner = hostParts[0];
      const project = window.location.pathname.split("/").filter(Boolean)[0];
      $("owner").value = owner;
      $("repo").value = project || `${owner}.github.io`;
    }

    loadPublicData();
  </script>
</body>
</html>
