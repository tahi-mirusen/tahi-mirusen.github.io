<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>マイサイト</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --page-bg: #f6f8fb;
      --text-color: #253041;
      --card-bg: #ffffff;
      --accent: #315ed2;
      --header-bg: #ffffff;
      --border-color: #e5eaf0;
      --site-width: 960px;
      --text-size: 16px;
      --card-radius: 14px;
      --content-align: left;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text-color);
      background-color: var(--page-bg);
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
      font-family: "Noto Sans JP", sans-serif;
      font-size: var(--text-size);
      line-height: 1.8;
    }

    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .wrap {
      width: min(var(--site-width), calc(100% - 32px));
      margin: auto;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0;
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: 1.3rem;
    }

    h2 {
      font-size: 1.35rem;
    }

    h3 {
      font-size: 1.1rem;
    }

    main {
      padding: 32px 0 64px;
    }

    .card {
      padding: 24px;
      margin-bottom: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(min(240px, 100%), 1fr)
      );
      gap: 16px;
    }

    .grid .card {
      margin-bottom: 0;
    }

    .multiline {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    a {
      color: var(--accent);
      overflow-wrap: anywhere;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
      padding: 8px 14px;
      color: #fff;
      background: #315ed2;
      border: 0;
      border-radius: 8px;
    }

    button.secondary {
      color: #253041;
      background: #e9edf3;
    }

    button.danger {
      color: #a32f3b;
      background: #fcebed;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    label {
      display: block;
      margin-bottom: 14px;
      font-weight: 500;
    }

    input, textarea, select {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 9px 11px;
      color: #253041;
      background: #fff;
      border: 1px solid #cdd6e1;
      border-radius: 8px;
    }

    input[type="color"] {
      height: 44px;
      padding: 4px;
    }

    input[type="checkbox"] {
      display: inline-block;
      width: auto;
      margin: 0 8px 0 0;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .hint {
      color: #627086;
      font-size: 0.9rem;
    }

    .status {
      min-height: 1.8em;
      color: #315ed2;
    }

    .editor-item {
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid #dce3ec;
      border-radius: 10px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(min(180px, 100%), 1fr)
      );
      gap: 0 16px;
    }

    [hidden] {
      display: none !important;
    }

    #public-view {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 32px;
      align-items: start;
    }

    .site-nav {
      position: sticky;
      top: 24px;
      padding: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
    }

    .site-nav a {
      display: block;
      padding: 10px 12px;
      color: var(--text-color);
      text-decoration: none;
      border-radius: 8px;
    }

    .site-nav a:hover,
    .site-nav a:focus-visible,
    .site-nav a[aria-current="page"] {
      color: var(--accent);
      background: rgba(128, 128, 128, 0.12);
    }

    .public-content {
      min-width: 0;
      text-align: var(--content-align);
    }

    .public-image {
      display: block;
      max-width: 100%;
      max-height: 500px;
      margin: 0 auto 16px;
      border-radius: var(--card-radius);
      object-fit: contain;
    }

    #admin-view {
      color: #253041;
    }

    #admin-view .card {
      background: #fff;
      border-color: #e5eaf0;
    }

    #admin-view a {
      color: #315ed2;
    }

    @media (max-width: 640px) {
      #public-view {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .site-nav {
        position: static;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap header-inner">
      <h1 id="site-name">マイサイト</h1>
      <button id="open-admin" class="secondary" type="button">
        管理画面
      </button>
    </div>
  </header>

  <main class="wrap">
    <div id="public-view">
      <nav id="site-nav" class="site-nav" aria-label="サイトメニュー"></nav>
      <div id="public-content" class="public-content"></div>
    </div>

    <div id="admin-view" hidden>
      <div class="actions">
        <h2>管理画面</h2>
        <button id="close-admin" class="secondary" type="button">
          サイトに戻る
        </button>
      </div>

      <div class="card">
        <h3>GitHubに接続</h3>
        <p class="hint">
          トークンは接続中だけ使用し、サイトのデータには保存しません。
          このページを閉じるか「サイトに戻る」を押すと接続を解除します。
        </p>

        <label>
          ユーザー名
          <input id="owner" autocomplete="off">
        </label>

        <label>
          リポジトリ名
          <input id="repo" autocomplete="off">
        </label>

        <label>
          公開に使うブランチ
          <input id="branch" value="main" autocomplete="off">
        </label>

        <label>
          GitHubのアクセストークン
          <input id="token" type="password" autocomplete="off">
        </label>

        <button id="connect" type="button">接続する</button>
      </div>

      <div id="editor" hidden>
        <div class="card">
          <h3>基本情報</h3>

          <label>
            サイト名
            <input id="edit-name">
          </label>

          <label>
            自己紹介
            <textarea id="edit-profile"></textarea>
          </label>

          <div id="profile-image-editor"></div>
        </div>

        <div class="card">
          <h3>デザイン</h3>
          <p class="hint">
            色・サイズなどを変更できます。変更内容はサイトに戻ると確認できます。
          </p>
          <div id="design-editor" class="settings-grid"></div>
          <div id="background-editor"></div>
          <button id="reset-design" class="secondary" type="button">
            デザインを初期設定に戻す
          </button>
        </div>

        <div class="card">
          <h3>メニューと項目</h3>
          <p class="hint">
            項目名、表示・非表示、並び順を変更できます。
            文章や画像を載せる項目も追加できます。
          </p>
          <div id="section-editor"></div>
          <button id="add-section" class="secondary" type="button">
            項目を追加
          </button>
        </div>

        <div class="card">
          <h3>作品</h3>
          <div id="work-editor"></div>
          <button id="add-work" class="secondary" type="button">
            作品を追加
          </button>
        </div>

        <div class="card">
          <h3>ブログ</h3>
          <div id="post-editor"></div>
          <button id="add-post" class="secondary" type="button">
            記事を追加
          </button>
        </div>

        <div class="card">
          <div class="actions">
            <button id="save" type="button">変更を保存して公開</button>
          </div>
          <p class="hint">
            画像やファイルのアップロード後も、このボタンで内容を保存してください。
            公開サイトへの反映には少し時間がかかる場合があります。
          </p>
        </div>
      </div>

      <p id="status" class="status" role="status"></p>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const defaultDesign = () => ({
      pageBg: "#f6f8fb",
      textColor: "#253041",
      cardBg: "#ffffff",
      accent: "#315ed2",
      headerBg: "#ffffff",
      borderColor: "#e5eaf0",
      width: 960,
      textSize: 16,
      radius: 14,
      align: "left",
      backgroundImage: ""
    });

    const defaultSections = () => [
      {
        id: "about",
        type: "about",
        title: "自己紹介",
        visible: true
      },
      {
        id: "works-section",
        type: "works",
        title: "作品",
        visible: true
      },
      {
        id: "blog-section",
        type: "blog",
        title: "ブログ",
        visible: true
      }
    ];

    const initialData = () => ({
      siteName: "マイサイト",
      profile: "ここに自己紹介を書きます。",
      profileImage: "",
      works: [],
      posts: [],
      design: defaultDesign(),
      sections: defaultSections()
    });

    let data = initialData();
    let connection = null;
    let busy = false;

    function normalize(value) {
      const source = value && typeof value === "object" ? value : {};
      const defaults = initialData();

      return {
        ...source,
        siteName: String(source.siteName || defaults.siteName),
        profile: String(source.profile || ""),
        profileImage: String(source.profileImage || ""),
        works: Array.isArray(source.works)
          ? source.works.filter((item) => item && typeof item === "object")
          : [],
        posts: Array.isArray(source.posts)
          ? source.posts.filter((item) => item && typeof item === "object")
          : [],
        design: {
          ...defaultDesign(),
          ...(source.design && typeof source.design === "object"
            ? source.design
            : {})
        },
        sections: Array.isArray(source.sections)
          ? source.sections.filter((item) => item && typeof item === "object")
          : defaultSections()
      };
    }

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = String(text);
      if (className) node.className = className;
      return node;
    }

    function safeLink(value) {
      if (!value) return null;

      try {
        const url = new URL(value, window.location.href);
        if (url.protocol !== "https:" && url.protocol !== "http:") {
          return null;
        }
        return url.href;
      } catch {
        return null;
      }
    }

    function validColor(value, fallback) {
      return /^#[0-9a-f]{6}$/i.test(String(value)) ? value : fallback;
    }

    function boundedNumber(value, fallback, min, max) {
      const number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.min(max, Math.max(min, number));
    }

    function applyDesign() {
      const design = data.design;
      const defaults = defaultDesign();
      const root = document.documentElement;

      root.style.setProperty(
        "--page-bg",
        validColor(design.pageBg, defaults.pageBg)
      );
      root.style.setProperty(
        "--text-color",
        validColor(design.textColor, defaults.textColor)
      );
      root.style.setProperty(
        "--card-bg",
        validColor(design.cardBg, defaults.cardBg)
      );
      root.style.setProperty(
        "--accent",
        validColor(design.accent, defaults.accent)
      );
      root.style.setProperty(
        "--header-bg",
        validColor(design.headerBg, defaults.headerBg)
      );
      root.style.setProperty(
        "--border-color",
        validColor(design.borderColor, defaults.borderColor)
      );
      root.style.setProperty(
        "--site-width",
        `${boundedNumber(design.width, 960, 600, 1600)}px`
      );
      root.style.setProperty(
        "--text-size",
        `${boundedNumber(design.textSize, 16, 12, 28)}px`
      );
      root.style.setProperty(
        "--card-radius",
        `${boundedNumber(design.radius, 14, 0, 50)}px`
      );
      root.style.setProperty(
        "--content-align",
        ["left", "center", "right"].includes(design.align)
          ? design.align
          : "left"
      );

      const background = safeLink(design.backgroundImage);
      document.body.style.backgroundImage = background
        ? `url(${JSON.stringify(background)})`
        : "none";
    }

    function appendImage(parent, source, alt) {
      const url = safeLink(source);
      if (!url) return;

      const image = document.createElement("img");
      image.className = "public-image";
      image.src = url;
      image.alt = alt || "";
      image.loading = "lazy";
      parent.append(image);
    }

    function appendLink(parent, source, text) {
      const url = safeLink(source);
      if (!url) return;

      const link = element("a", text);
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      parent.append(link);
    }

    function renderPublic() {
      applyDesign();

      document.title = data.siteName || "マイサイト";
      $("site-name").textContent = data.siteName || "マイサイト";

      const nav = $("site-nav");
      const content = $("public-content");
      nav.replaceChildren();
      content.replaceChildren();

      const visibleSections = data.sections.filter(
        (section) => section.visible !== false && section.id
      );

      const requestedId = window.location.hash.slice(1);
      const selected = visibleSections.find(
        (section) => section.id === requestedId
      ) || visibleSections[0];

      visibleSections.forEach((section) => {
        const link = element("a", section.title || "項目");
        link.href = `#${section.id}`;

        if (selected && section.id === selected.id) {
          link.setAttribute("aria-current", "page");
        }

        nav.append(link);
      });

      if (!selected) {
        content.append(element("p", "表示する項目がありません。"));
        return;
      }

      const sectionNode = document.createElement("section");
      sectionNode.id = selected.id;
      sectionNode.append(element("h2", selected.title || "項目"));

      if (selected.type === "about") {
        const card = element("div", undefined, "card");
        appendImage(card, data.profileImage, "プロフィール画像");
        card.append(element("p", data.profile, "multiline"));
        sectionNode.append(card);
      }

      if (selected.type === "works") {
        const grid = element("div", undefined, "grid");

        data.works.forEach((work) => {
          const card = element("article", undefined, "card");
          appendImage(card, work.image, work.title || "作品画像");
          card.append(element("h3", work.title || "無題"));
          card.append(element("p", work.description || "", "multiline"));
          appendLink(card, work.file, "ファイルを開く・ダウンロード");
          grid.append(card);
        });

        sectionNode.append(grid);
      }

      if (selected.type === "blog") {
        data.posts.forEach((post) => {
          const card = element("article", undefined, "card");
          card.append(element("h3", post.title || "無題"));

          if (post.date) {
            card.append(element("p", post.date, "hint"));
          }

          appendImage(card, post.image, post.title || "記事画像");
          card.append(element("p", post.body || "", "multiline"));
          sectionNode.append(card);
        });
      }

      if (selected.type === "custom") {
        const card = element("div", undefined, "card");
        appendImage(card, selected.image, selected.title || "画像");
        card.append(element("p", selected.body || "", "multiline"));

        if (selected.link) {
          appendLink(card, selected.link, selected.linkText || "リンクを開く");
        }

        sectionNode.append(card);
      }

      content.append(sectionNode);
    }

    window.addEventListener("hashchange", renderPublic);

    function field(parent, labelText, value, onInput, options = {}) {
      const label = element("label", labelText);
      const input = document.createElement(
        options.multiline ? "textarea" : "input"
      );

      if (options.type) input.type = options.type;
      if (options.min !== undefined) input.min = options.min;
      if (options.max !== undefined) input.max = options.max;

      input.value = value ?? "";
      input.addEventListener("input", () => onInput(input.value));

      label.append(input);
      parent.append(label);
      return input;
    }

    function selectField(parent, labelText, value, choices, onChange) {
      const label = element("label", labelText);
      const select = document.createElement("select");

      choices.forEach(([choiceValue, choiceText]) => {
        const option = element("option", choiceText);
        option.value = choiceValue;
        select.append(option);
      });

      select.value = value;
      select.addEventListener("change", () => onChange(select.value));

      label.append(select);
      parent.append(label);
    }

    function checkboxField(parent, labelText, checked, onChange) {
      const label = document.createElement("label");
      const input = document.createElement("input");

      input.type = "checkbox";
      input.checked = checked;
      input.addEventListener("change", () => onChange(input.checked));

      label.append(input, document.createTextNode(labelText));
      parent.append(label);
    }

    function setStatus(message) {
      $("status").textContent = message;
    }

    function setBusy(value) {
      busy = value;

      document.querySelectorAll("#admin-view button").forEach((button) => {
        button.disabled = value;
      });

      document.querySelectorAll("#admin-view input, #admin-view textarea, #admin-view select")
        .forEach((input) => {
          input.disabled = value;
        });
    }

    function bytesToBase64(bytes) {
      let binary = "";
      const chunkSize = 8192;

      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(
          ...bytes.subarray(i, i + chunkSize)
        );
      }

      return btoa(binary);
    }

    function base64ToText(base64) {
      const binary = atob(base64.replace(/\s/g, ""));
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function apiPath(path) {
      const encodedPath = path
        .split("/")
        .map(encodeURIComponent)
        .join("/");

      return `https://api.github.com/repos/${encodeURIComponent(connection.owner)}/${encodeURIComponent(connection.repo)}/contents/${encodedPath}`;
    }

    async function githubRequest(url, options = {}) {
      const { allow404, ...fetchOptions } = options;

      const response = await fetch(url, {
        ...fetchOptions,
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${connection.token}`,
          "Content-Type": "application/json",
          ...fetchOptions.headers
        }
      });

      if (response.status === 404 && allow404) return null;

      const result = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          result.message || `GitHubエラー: ${response.status}`
        );
      }

      return result;
    }

    async function getFile
